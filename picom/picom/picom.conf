backend = "glx";
vsync = false;

shadow = false;

fading = true;
fade-delta = 8;
fade-in-step = 0.2;
fade-out-step = 0.2;
rounded-corners = true;
corner-radius = 0;

opacity-rule = [
  "75:class_g = 'Alacritty'",
];

blur: {
    method = "dual_kawase";
    strength = 8;
}

blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
  "class_g = 'Conky'",
  "class_g = 'conky-semi'",
  "name = 'conky'",
  "class_g *= 'zenity'",
  "class_g *= 'Zenity'",
  "class_g = 'kazam'",
  "class_g = 'Kazam'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'menu'",
  "window_type = 'tooltip'"
];

wintypes:
{
    dock = { blur-background = true; shadow = false; opacity = 0.6; };

    popup_menu = { blur-background = true; opacity = 0.9; };
    dropdown_menu = { blur-background = true; opacity = 0.9; };
}
