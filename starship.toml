"$schema" = 'https://starship.rs/config-schema.json'

palette = "custom"

format = """
[](core_dark)\
[ ](bg:core_dark fg:text_light)\
[](bg:core_red fg:core_dark)\
$directory\
[](fg:core_red bg:core_mid)\
$git_branch\
$git_status\
[](fg:core_mid bg:core_dark)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:core_dark bg:core_darker)\
$time\
[](fg:core_darker)\
$character\
"""

# ─────────────────────────────
# DIRECTORY
# ─────────────────────────────
[directory]
style = "fg:text_light bg:core_red"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# ─────────────────────────────
# GIT
# ─────────────────────────────
[git_branch]
symbol = ""
style = "bg:core_mid"
format = "[ $symbol $branch ](fg:text_light bg:core_mid)"

[git_status]
style = "bg:core_mid"
format = "[($all_status$ahead_behind )](fg:text_light bg:core_mid)"

# ─────────────────────────────
# LANGUAGES
# ─────────────────────────────
[nodejs]
symbol = ""
style = "bg:core_dark"
format = "[ $symbol ($version) ](fg:core_red bg:core_dark)"

[bun]
symbol = ""
style = "bg:core_dark"
format = "[ $symbol ($version) ](fg:core_red bg:core_dark)"

[rust]
symbol = ""
style = "bg:core_dark"
format = "[ $symbol ($version) ](fg:core_red bg:core_dark)"

[golang]
symbol = ""
style = "bg:core_dark"
format = "[ $symbol ($version) ](fg:core_red bg:core_dark)"

[php]
symbol = ""
style = "bg:core_dark"
format = "[ $symbol ($version) ](fg:core_red bg:core_dark)"

# ─────────────────────────────
# TIME
# ─────────────────────────────
[time]
disabled = false
format = "[  $time ](fg:text_soft bg:core_darker)"
time_format = "%H:%M"

# ─────────────────────────────
# PROMPT
# ─────────────────────────────
[line_break]
disabled = true

[character]
disabled = false
success_symbol = "[❯](bold core_red)"
error_symbol = "[❯](bold core_mid)"

# ─────────────────────────────
# PALETTE
# ─────────────────────────────
[palettes.custom]
core_bg     = "#242424"
core_red    = "#c60a0a"
core_blue   = "#FF3030"
core_mid    = "#555555"
core_dark   = "#303030"
core_darker = "#242424"

text_dark   = "#FFFFFF"
text_light  = "#FFFFFF"
text_soft   = "#D0D0D0"